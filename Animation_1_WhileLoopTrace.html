<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>while loop trace</title>
<style>
  :root {
    --bg: #1a1d23;
    --panel: #242830;
    --panel-2: #2d323c;
    --ink: #e8e6e1;
    --muted: #8b8d93;
    --accent: #f0a04b;
    --green: #a3d977;
    --red: #e57373;
    --blue: #5dadec;
    --line: #3a3f4b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', 'Fira Code', Menlo, monospace;
    padding: 24px;
    min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 22px; font-family: Georgia, serif; font-style: italic; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .controls {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 22px;
    margin-bottom: 20px;
    display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
  }
  .ctl-label { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
  .seg {
    display: flex;
    background: var(--panel-2);
    border-radius: 6px;
    padding: 3px;
    gap: 2px;
  }
  .seg button {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .seg button.active {
    background: var(--accent);
    color: #1a1d23;
    font-weight: 600;
  }
  .num-input {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--accent);
    font-family: inherit;
    font-size: 18px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    width: 70px;
  }
  .num-input:focus { outline: none; border-color: var(--accent); }
  .step-btn {
    background: var(--accent);
    color: #1a1d23;
    border: none;
    padding: 10px 22px;
    border-radius: 6px;
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .step-btn:hover { background: #ffb866; }
  .step-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ghost-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }
  .stage {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 20px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 22px;
  }
  .panel-title { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 14px; }
  .codebox {
    background: #0d1117;
    border-radius: 6px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.85;
    border: 1px solid var(--line);
    margin-bottom: 16px;
  }
  .cl {
    padding: 2px 8px;
    border-radius: 3px;
    transition: all 0.3s;
    opacity: 0.4;
  }
  .cl.eval { background: rgba(240, 160, 75, 0.18); opacity: 1; color: var(--accent); border-left: 2px solid var(--accent); padding-left: 6px; }
  .cl.taken { background: rgba(163, 217, 119, 0.12); opacity: 1; color: var(--green); border-left: 2px solid var(--green); padding-left: 6px; }
  .cl.failed { background: rgba(229, 115, 115, 0.08); opacity: 0.7; color: var(--red); }
  .kw { color: #5dadec; }
  .str { color: var(--green); }
  .num { color: #f0a04b; }
  .com { color: var(--muted); font-style: italic; }
  .state-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .state-cell {
    padding: 12px 16px;
    background: var(--panel-2);
    border-radius: 5px;
    border: 1px solid var(--line);
  }
  .state-cell .lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 4px; }
  .state-cell .val { font-size: 22px; color: var(--accent); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .check-block {
    padding: 12px 16px;
    background: var(--panel-2);
    border-radius: 5px;
    margin-bottom: 14px;
    border-left: 3px solid var(--line);
    transition: all 0.3s;
  }
  .check-block.true { border-left-color: var(--green); background: rgba(163, 217, 119, 0.06); }
  .check-block.false { border-left-color: var(--red); background: rgba(229, 115, 115, 0.06); }
  .check-block .lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 4px; }
  .check-block .cond { font-family: 'JetBrains Mono', monospace; font-size: 14px; }
  .check-block .verdict {
    margin-left: 12px;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .check-block.true .verdict { background: rgba(163, 217, 119, 0.2); color: var(--green); }
  .check-block.false .verdict { background: rgba(229, 115, 115, 0.2); color: var(--red); }
  .output-block {
    padding: 14px 16px;
    background: #000;
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  .output-label { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 6px; }
  .output-text {
    font-size: 18px;
    color: var(--ink);
    min-height: 28px;
    font-family: 'JetBrains Mono', monospace;
    word-break: break-all;
  }
  .output-text.empty { color: var(--muted); font-style: italic; font-size: 13px; }
  .iter-counter {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    font-style: italic;
    font-family: Georgia, serif;
  }
  .phase-tag {
    display: inline-block;
    font-size: 9px;
    padding: 2px 8px;
    border-radius: 8px;
    letter-spacing: 0.1em;
    background: var(--accent);
    color: #1a1d23;
    margin-bottom: 8px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>while loop — step through, see the count climb</h1>
  <div class="sub">Click Step ▸ over and over. Watch initialization run once, then condition / body / update repeat until the condition fails.</div>

  <div class="controls">
    <div style="display:flex; flex-direction:column; gap:6px;">
      <span class="ctl-label">PROGRAM</span>
      <div class="seg" id="progSeg">
        <button class="active" data-p="up">print 1 to N</button>
        <button data-p="down">print N to 1</button>
        <button data-p="odd">odd numbers</button>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; gap:6px;">
      <span class="ctl-label">N</span>
      <input type="number" class="num-input" id="nIn" value="4" min="1" max="20">
    </div>
    <div style="margin-left:auto; display:flex; gap:10px;">
      <button class="step-btn" id="stepBtn" onclick="step()">Step ▸</button>
      <button class="ghost-btn" onclick="autoplay()">Auto-play</button>
      <button class="ghost-btn" onclick="reset()">Reset</button>
    </div>
  </div>

  <div class="stage">
    <div class="panel">
      <div class="panel-title">CODE</div>
      <div class="codebox" id="codebox"></div>

      <div class="panel-title">PROGRAM STATE</div>
      <div class="state-grid">
        <div class="state-cell">
          <div class="lbl">N</div>
          <div class="val" id="stateN">—</div>
        </div>
        <div class="state-cell">
          <div class="lbl" id="varLbl">COUNT</div>
          <div class="val" id="stateCount">—</div>
        </div>
      </div>

      <div class="iter-counter" id="iterLabel">not started</div>
    </div>

    <div class="panel">
      <div class="panel-title">EXECUTION</div>

      <div class="check-block" id="checkBlock">
        <div class="lbl" id="phaseLabel">PHASE</div>
        <div style="display:flex; align-items:center;">
          <span class="cond" id="checkCond">—</span>
          <span class="verdict" id="checkVerdict" style="display:none;"></span>
        </div>
      </div>

      <div class="output-block">
        <div class="output-label">OUTPUT</div>
        <div class="output-text empty" id="output">— press Step to begin —</div>
      </div>
    </div>
  </div>
</div>

<script>
  const programs = {
    up: {
      varName: 'count',
      init: 1,
      cmpOp: (c, n) => c <= n,
      cmpStr: 'count <= N',
      body: c => c,
      update: c => c + 1,
      updStr: 'count = count + 1',
      code: [
        '<span class="kw">int</span> count = <span class="num">1</span>;',
        '<span class="kw">while</span> (count &lt;= N) {',
        '  System.out.print(count + <span class="str">" "</span>);',
        '  count++;',
        '}'
      ]
    },
    down: {
      varName: 'count',
      init: null, // = N
      initIsN: true,
      cmpOp: (c, n) => c >= 1,
      cmpStr: 'count >= 1',
      body: c => c,
      update: c => c - 1,
      updStr: 'count = count - 1',
      code: [
        '<span class="kw">int</span> count = N;',
        '<span class="kw">while</span> (count &gt;= <span class="num">1</span>) {',
        '  System.out.print(count + <span class="str">" "</span>);',
        '  count--;',
        '}'
      ]
    },
    odd: {
      varName: 'count',
      init: 1,
      cmpOp: (c, n) => c <= n,
      cmpStr: 'count <= N',
      body: c => c,
      update: c => c + 2,
      updStr: 'count = count + 2',
      code: [
        '<span class="kw">int</span> count = <span class="num">1</span>;',
        '<span class="kw">while</span> (count &lt;= N) {',
        '  System.out.print(count + <span class="str">" "</span>);',
        '  count += <span class="num">2</span>;',
        '}'
      ]
    }
  };

  let progKey = 'up';
  let phase = 'idle'; // idle | init | check | body | update | done
  let count = null;
  let outputBuf = [];
  let iterCount = 0;
  let timer = null;

  document.getElementById('progSeg').onclick = e => {
    if (e.target.tagName !== 'BUTTON') return;
    document.getElementById('progSeg').querySelectorAll('button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    progKey = e.target.dataset.p;
    reset();
  };

  document.getElementById('nIn').oninput = reset;

  function reset() {
    if (timer) { clearInterval(timer); timer = null; }
    phase = 'idle';
    count = null;
    outputBuf = [];
    iterCount = 0;
    renderCode([]);
    document.getElementById('stateN').textContent = '—';
    document.getElementById('stateCount').textContent = '—';
    document.getElementById('phaseLabel').textContent = 'PHASE';
    document.getElementById('checkCond').textContent = '— press Step —';
    document.getElementById('checkVerdict').style.display = 'none';
    document.getElementById('checkBlock').className = 'check-block';
    document.getElementById('output').className = 'output-text empty';
    document.getElementById('output').textContent = '— press Step to begin —';
    document.getElementById('iterLabel').textContent = 'not started';
    document.getElementById('stepBtn').disabled = false;
  }

  function step() {
    const p = programs[progKey];
    const N = +document.getElementById('nIn').value;

    if (phase === 'idle') {
      // Initialization
      count = p.initIsN ? N : p.init;
      phase = 'check';
      document.getElementById('stateN').textContent = N;
      document.getElementById('stateCount').textContent = count;
      document.getElementById('phaseLabel').innerHTML = '<span class="phase-tag">INIT</span> initialization done';
      document.getElementById('checkCond').textContent = `${p.varName} = ${count}`;
      document.getElementById('checkVerdict').style.display = 'none';
      document.getElementById('checkBlock').className = 'check-block';
      renderCode([0]);
      document.getElementById('iterLabel').textContent = 'init complete — next: check condition';
      return;
    }
    if (phase === 'check') {
      const passed = p.cmpOp(count, N);
      const condDisplay = `${p.cmpStr.replace(p.varName, count)}  →  ${passed ? 'TRUE' : 'FALSE'}`;
      document.getElementById('phaseLabel').innerHTML = '<span class="phase-tag">CONDITION</span> check condition';
      document.getElementById('checkCond').textContent = condDisplay;
      const v = document.getElementById('checkVerdict');
      v.textContent = passed ? '✓' : '✗';
      v.style.display = 'inline-block';
      document.getElementById('checkBlock').className = 'check-block ' + (passed ? 'true' : 'false');
      renderCode([1]);
      if (passed) {
        phase = 'body';
        document.getElementById('iterLabel').textContent = `iteration ${iterCount + 1} — condition true, run body`;
      } else {
        phase = 'done';
        renderCode([1, 4]);
        document.getElementById('iterLabel').textContent = `loop exits after ${iterCount} iteration${iterCount === 1 ? '' : 's'}`;
        document.getElementById('stepBtn').disabled = true;
        if (timer) { clearInterval(timer); timer = null; }
      }
      return;
    }
    if (phase === 'body') {
      const printed = p.body(count);
      outputBuf.push(printed);
      const out = document.getElementById('output');
      out.className = 'output-text';
      out.textContent = outputBuf.join(' ');
      document.getElementById('phaseLabel').innerHTML = '<span class="phase-tag">BODY</span> execute body';
      document.getElementById('checkCond').textContent = `print(${count})`;
      document.getElementById('checkVerdict').style.display = 'none';
      document.getElementById('checkBlock').className = 'check-block';
      renderCode([2]);
      phase = 'update';
      document.getElementById('iterLabel').textContent = `printed ${printed} — next: update`;
      return;
    }
    if (phase === 'update') {
      const old = count;
      count = p.update(count);
      iterCount++;
      document.getElementById('stateCount').textContent = count;
      document.getElementById('phaseLabel').innerHTML = '<span class="phase-tag">UPDATE</span> update step';
      document.getElementById('checkCond').textContent = `${p.updStr}  →  ${count}`;
      document.getElementById('checkVerdict').style.display = 'none';
      document.getElementById('checkBlock').className = 'check-block';
      renderCode([3]);
      phase = 'check';
      document.getElementById('iterLabel').textContent = `count: ${old} → ${count} — back to top of loop`;
      return;
    }
  }

  function renderCode(highlightLines) {
    const p = programs[progKey];
    const cb = document.getElementById('codebox');
    let html = '';
    p.code.forEach((line, i) => {
      const cls = highlightLines.includes(i) ? ' eval' : '';
      html += `<div class="cl${cls}">${line}</div>`;
    });
    cb.innerHTML = html;
  }

  function autoplay() {
    if (timer) { clearInterval(timer); timer = null; return; }
    timer = setInterval(() => {
      if (phase === 'done') { clearInterval(timer); timer = null; return; }
      step();
    }, 700);
  }

  reset();
</script>
</body>
</html>
