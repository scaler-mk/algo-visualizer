<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dictionary — insert, update, delete</title>
<style>
  :root {
    --bg: #1a1d23; --panel: #242830; --panel-2: #2d323c;
    --ink: #e8e6e1; --muted: #8b8d93; --accent: #f0a04b;
    --green: #a3d977; --red: #e57373; --blue: #5dadec; --purple: #c084e8;
    --line: #3a3f4b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'JetBrains Mono', 'Fira Code', Menlo, monospace; padding: 24px; min-height: 100vh; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 22px; font-family: Georgia, serif; font-style: italic; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }

  .controls { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 22px; margin-bottom: 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .ctl-label { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; }
  .step-btn { background: var(--accent); color: #1a1d23; border: none; padding: 10px 22px; border-radius: 6px; font-family: inherit; font-weight: 600; font-size: 13px; cursor: pointer; }
  .step-btn:hover { background: #ffb866; }
  .step-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .reset-btn { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 8px 14px; border-radius: 4px; font-family: inherit; font-size: 11px; cursor: pointer; }
  .reset-btn:hover { color: var(--accent); border-color: var(--accent); }
  .qb { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 12px; border-radius: 4px; font-family: inherit; font-size: 11px; cursor: pointer; }
  .qb:hover { border-color: var(--accent); color: var(--accent); }
  .qb.active { border-color: var(--accent); color: var(--accent); background: rgba(240,160,75,0.08); }
  .iter-counter { font-size: 11px; color: var(--muted); }
  .iter-counter .num-c { color: var(--accent); font-weight: 600; margin: 0 4px; }

  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 22px; }
  .panel-title { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 14px; }

  .scenario-head { font-family: Georgia, serif; font-style: italic; font-size: 14px; color: var(--accent); margin-bottom: 4px; font-weight: 600; }
  .scenario-sub { font-size: 11px; color: var(--muted); font-family: Georgia, serif; font-style: italic; margin-bottom: 14px; }

  .code { background: #0d1117; border-radius: 6px; padding: 14px 18px; font-size: 12.5px; line-height: 1.7; white-space: pre; position: relative; }
  .code-line { display: block; padding: 1px 6px; margin: 0 -6px; border-radius: 3px; transition: background 0.18s; }
  .code-line.exec { background: rgba(240, 160, 75, 0.18); border-left: 3px solid var(--accent); padding-left: 9px; margin-left: -9px; }
  .code-line.exec-return { background: rgba(163, 217, 119, 0.18); border-left: 3px solid var(--green); padding-left: 9px; margin-left: -9px; }
  .code-line.exec-fail { background: rgba(229, 115, 115, 0.18); border-left: 3px solid var(--red); padding-left: 9px; margin-left: -9px; }
  .kw { color: var(--purple); }
  .fn { color: var(--blue); }
  .num { color: var(--green); }
  .str { color: #d4a574; }
  .cmt { color: var(--muted); font-style: italic; }

  .viz-area { background: #0d1117; border-radius: 6px; padding: 18px; min-height: 400px; display: flex; flex-direction: column; gap: 14px; }

  .dict-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .dict-card .lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .dict-card .lbl .count-tag { color: var(--accent); font-family: 'JetBrains Mono', monospace; padding: 1px 7px; background: rgba(240,160,75,0.1); border-radius: 3px; font-size: 10px; }
  .pair-row { display: grid; grid-template-columns: 1fr 24px 1fr; gap: 6px; align-items: center; margin-bottom: 5px; transition: all 0.3s; padding: 3px 4px; border-radius: 4px; }
  .pair-row.new { background: rgba(163, 217, 119, 0.12); animation: slidein 0.4s ease-out; }
  .pair-row.updated { background: rgba(240, 160, 75, 0.12); }
  .pair-row.removing { background: rgba(229, 115, 115, 0.15); animation: fadeout 0.5s ease-out forwards; }
  @keyframes slidein { from { transform: translateY(-8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes fadeout { 0% { opacity: 1; } 100% { opacity: 0.3; transform: translateX(-10px); } }
  .pair-key { background: rgba(240,160,75,0.12); border: 2px solid var(--accent); border-radius: 5px; padding: 6px 10px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--accent); font-weight: 700; text-align: center; }
  .pair-row.new .pair-key { background: rgba(163, 217, 119, 0.15); border-color: var(--green); color: var(--green); }
  .pair-row.removing .pair-key { background: rgba(229, 115, 115, 0.15); border-color: var(--red); color: var(--red); text-decoration: line-through; }
  .pair-arrow { text-align: center; color: var(--muted); font-size: 13px; }
  .pair-val { background: rgba(93,173,236,0.12); border: 2px solid var(--blue); border-radius: 5px; padding: 6px 10px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--blue); font-weight: 700; text-align: center; transition: all 0.3s; }
  .pair-row.updated .pair-val { background: rgba(240, 160, 75, 0.15); border-color: var(--accent); color: var(--accent); }
  .pair-row.removing .pair-val { background: rgba(229, 115, 115, 0.15); border-color: var(--red); color: var(--red); text-decoration: line-through; }

  /* Op display */
  .op-display { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 70px; }
  .op-line { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--ink); }
  .op-line .label { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; margin-right: 8px; }
  .op-line.action { color: var(--accent); font-weight: 700; }
  .op-line.action.delete { color: var(--red); }
  .op-line.action.update { color: var(--blue); }
  .return-val { display: flex; align-items: center; gap: 10px; }
  .return-val .lbl-r { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; }
  .return-val .v { padding: 4px 10px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; }
  .return-val .v.ok { background: rgba(163, 217, 119, 0.15); border: 1.5px solid var(--green); color: var(--green); }
  .return-val .v.none-val { background: rgba(192, 132, 232, 0.12); border: 1.5px solid var(--purple); color: var(--purple); }
  .return-val .v.bad { background: rgba(229, 115, 115, 0.15); border: 1.5px solid var(--red); color: var(--red); }
  .return-val .v.default { background: rgba(192, 132, 232, 0.12); border: 1.5px solid var(--purple); color: var(--purple); }

  .commentary { background: #0d1117; border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; font-family: Georgia, serif; font-style: italic; font-size: 13px; line-height: 1.55; color: var(--ink); min-height: 60px; }
  .commentary .ok { color: var(--green); font-weight: 700; font-style: normal; font-family: 'JetBrains Mono', monospace; }
  .commentary .bad { color: var(--red); font-weight: 700; font-style: normal; font-family: 'JetBrains Mono', monospace; }
  .commentary .blue { color: var(--blue); font-weight: 700; font-style: normal; font-family: 'JetBrains Mono', monospace; }
  .commentary .accent { color: var(--accent); font-weight: 700; font-style: normal; font-family: 'JetBrains Mono', monospace; }
  .commentary .purple { color: var(--purple); font-weight: 700; font-style: normal; font-family: 'JetBrains Mono', monospace; }

  .insight { background: rgba(163, 217, 119, 0.08); border: 1px dashed var(--green); border-radius: 6px; padding: 12px 14px; margin-top: 12px; font-family: Georgia, serif; font-style: italic; font-size: 12.5px; color: var(--green); line-height: 1.5; }
  .insight .accent { color: var(--accent); font-weight: 700; font-style: normal; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Insert, Update, Delete — mutating a dictionary</h1>
    <p class="sub">Assigning to a key inserts or updates. pop() returns the removed value. del just removes.</p>

    <div class="controls">
      <span class="ctl-label">SCENARIOS:</span>
      <button class="qb" data-i="0">Insert new key</button>
      <button class="qb" data-i="1">Update existing key</button>
      <button class="qb" data-i="2">pop() — returns value</button>
      <button class="qb" data-i="3">pop() with default</button>
      <button class="qb" data-i="4">del keyword</button>
      <button class="qb" data-i="5">Quiz 3 — pop then len</button>
      <span style="flex:1"></span>
      <span class="iter-counter">STEP<span class="num-c" id="stepNum">0</span>/ <span id="stepMax">0</span></span>
      <button class="step-btn" id="stepBtn">Step ▸</button>
      <button class="reset-btn" id="resetBtn">↺ Reset</button>
    </div>

    <div class="stage">
      <div class="panel">
        <div class="panel-title">SOURCE CODE</div>
        <div class="scenario-head" id="scTitle"></div>
        <div class="scenario-sub" id="scSub"></div>
        <div class="code" id="codeBox"></div>
      </div>
      <div class="panel">
        <div class="panel-title">VISUALIZATION</div>
        <div class="viz-area">
          <div class="dict-card">
            <div class="lbl">DICTIONARY <span class="count-tag" id="countTag">len = 0</span></div>
            <div id="dictRows"></div>
          </div>
          <div class="op-display">
            <div class="op-line" id="opLine">—</div>
            <div class="return-val" id="returnVal" style="display:none;"></div>
          </div>
          <div class="commentary" id="commentary">Pick a scenario, then click <strong>Step ▸</strong>.</div>
          <div id="insightHost"></div>
        </div>
      </div>
    </div>
  </div>

<script>
function paint(text) {
  let h = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const protectedSegs = [];
  function makeKey(n) { let s = ''; n += 1; while (n > 0) { s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); } return '\u0001Z' + s + 'Z\u0002'; }
  function protect(html) { protectedSegs.push(html); return makeKey(protectedSegs.length - 1); }
  h = h.replace(/(#[^\n]*)/g, (m) => protect('<span class="cmt">' + m + '</span>'));
  h = h.replace(/("(?:[^"\\]|\\.)*")/g, (m) => protect('<span class="str">' + m + '</span>'));
  h = h.replace(/('(?:[^'\\]|\\.)*')/g, (m) => protect('<span class="str">' + m + '</span>'));
  h = h.replace(/\b(def|return|if|else|for|in|while|None|True|False|del)\b/g, '<span class="kw">$1</span>');
  h = h.replace(/\b(print|input|len|range|int|map|list|dict|pop)\b/g, '<span class="fn">$1</span>');
  h = h.replace(/(?<![\w.\-])(-?\d+\.?\d*)(?![\w.])/g, '<span class="num">$1</span>');
  h = h.replace(/\u0001Z([A-Z]+)Z\u0002/g, (_, code) => { let n = 0; for (let i = 0; i < code.length; i++) n = n * 26 + (code.charCodeAt(i) - 65); return protectedSegs[n - 1]; });
  return h;
}

const BASE = [
  { key: "'Madhuri'", val: "'Sweety'" },
  { key: "'Vinoth'",  val: "'Appu'" },
  { key: "'Shubham'", val: "'Zoo Zoo'" },
  { key: "'Kusum'",   val: "'ku ku'" },
  { key: "'Aakar'",   val: "'Golu'" }
];

const SCENARIOS = [
  {
    name: "Insert a new key",
    sub: "nicknames['Manish'] = 'Monu'",
    code: [
      "nicknames['Manish'] = 'Monu'",
      "print(nicknames)"
    ],
    plan: [
      { kind: 'exec', line: 0, msg: 'Key <span class="ok">\'Manish\'</span> not yet in the dict.', pairs: BASE, op: "assign to new key" },
      { kind: 'exec', line: 0, msg: 'Python adds it at the <span class="accent">end</span> (preserving insertion order).', pairs: [...BASE, {key:"'Manish'", val:"'Monu'", state:'new'}], op: "nicknames['Manish'] = 'Monu'", opKind: 'action' },
      { kind: 'exec-return', line: 1, msg: 'Length is now 6. New entry is at the tail.', pairs: [...BASE, {key:"'Manish'", val:"'Monu'"}] }
    ],
    insight: 'Assigning to a key that doesn\'t exist <span class="accent">creates</span> the pair. The new entry is appended at the end.'
  },
  {
    name: "Update an existing key",
    sub: "nicknames['Kusum'] = 'Ku Ku'  (overwrites)",
    code: [
      "nicknames['Kusum'] = 'Ku Ku'",
      "print(nicknames)"
    ],
    plan: [
      { kind: 'exec', line: 0, msg: 'Key <span class="accent">\'Kusum\'</span> already in the dict, mapped to <span class="blue">\'ku ku\'</span>.', pairs: BASE, op: "lookup before update" },
      { kind: 'exec', line: 0, msg: 'Same key + new value → <span class="blue">overwrites</span>. Position in the order doesn\'t change.', pairs: BASE.map((p,i) => i === 3 ? {...p, val:"'Ku Ku'", state:'updated'} : p), op: "nicknames['Kusum'] = 'Ku Ku'", opKind: 'update' },
      { kind: 'exec-return', line: 1, msg: 'Length is unchanged (5). Only the value at \'Kusum\' was replaced.', pairs: BASE.map((p,i) => i === 3 ? {...p, val:"'Ku Ku'"} : p) }
    ],
    insight: 'Same syntax for insert and update: <span class="accent">d[key] = value</span>. The key tells Python which one it is.'
  },
  {
    name: "pop() — removes AND returns value",
    sub: "nicknames.pop('Aakar')",
    code: [
      "v = nicknames.pop('Aakar')",
      "print(v)         # 'Golu'",
      "print(nicknames)"
    ],
    plan: [
      { kind: 'exec', line: 0, msg: 'Find <span class="accent">\'Aakar\'</span> → value <span class="blue">\'Golu\'</span>.', pairs: BASE, op: "nicknames.pop('Aakar')", opKind: 'action' },
      { kind: 'exec', line: 0, msg: 'Remove the pair from the dict. <span class="blue">pop() returns the removed value.</span>', pairs: BASE.map((p,i) => i === 4 ? {...p, state:'removing'} : p), op: "nicknames.pop('Aakar')", opKind: 'delete', returnVal: "'Golu'", returnKind: 'ok' },
      { kind: 'exec-return', line: 2, msg: 'Length drops to 4. The returned value is sitting in <span class="ok">v</span>.', pairs: BASE.slice(0, 4), returnVal: "'Golu'", returnKind: 'ok' }
    ],
    insight: '<span class="accent">pop(key)</span> is "destructive get" — it deletes AND hands you the value, so nothing\'s lost.'
  },
  {
    name: "pop() with default — safe on missing keys",
    sub: "nicknames.pop('AAkar', 'Oye')",
    code: [
      "v = nicknames.pop('AAkar', 'Oye')",
      "print(v)         # 'Oye'",
      "print(nicknames) # unchanged"
    ],
    plan: [
      { kind: 'exec', line: 0, msg: 'Look up <span class="bad">\'AAkar\'</span> — note the capital. Not in the dict.', pairs: BASE, op: "nicknames.pop('AAkar', 'Oye')" },
      { kind: 'exec', line: 0, msg: 'No match → no error. <span class="purple">.pop()</span> returns the <span class="purple">default \'Oye\'</span> instead.', pairs: BASE, op: "nicknames.pop('AAkar', 'Oye')", opKind: 'action', returnVal: "'Oye'", returnKind: 'default' },
      { kind: 'exec-return', line: 2, msg: 'Dict is unchanged. The default just told .pop() "if missing, give me this and move on."', pairs: BASE, returnVal: "'Oye'", returnKind: 'default' }
    ],
    insight: 'Without a default, <span class="accent">pop(key)</span> raises KeyError on a missing key. With a default, it stays quiet.'
  },
  {
    name: "del keyword — just removes",
    sub: "del nicknames['Aakar']",
    code: [
      "del nicknames['Aakar']",
      "print(nicknames)"
    ],
    plan: [
      { kind: 'exec', line: 0, msg: '<span class="purple">del</span> is a statement, not a function — no value comes back.', pairs: BASE, op: "del nicknames['Aakar']", opKind: 'action delete' },
      { kind: 'exec', line: 0, msg: 'The pair vanishes — but nothing is captured.', pairs: BASE.map((p,i) => i === 4 ? {...p, state:'removing'} : p), op: "del nicknames['Aakar']", opKind: 'action delete' },
      { kind: 'exec-return', line: 1, msg: 'Length now 4. <span class="bad">del raises KeyError if the key is missing</span> — no default option here.', pairs: BASE.slice(0, 4) }
    ],
    insight: 'Use <span class="accent">del</span> when you don\'t care about the removed value. Use <span class="accent">pop()</span> when you want to capture it.'
  },
  {
    name: "Quiz 3 — pop then len",
    sub: "a = {'Scaler': 1}; a.pop('Scaler'); print(len(a))",
    code: [
      "a = {'Scaler': 1}",
      "a.pop('Scaler')",
      "print(len(a))",
      "# Output: 0"
    ],
    plan: [
      { kind: 'exec', line: 0, msg: 'One-pair dictionary. Length = 1.', pairs: [{key:"'Scaler'", val:'1'}], op: "create" },
      { kind: 'exec', line: 1, msg: '<span class="blue">pop()</span> removes the only entry.', pairs: [{key:"'Scaler'", val:'1', state:'removing'}], op: "a.pop('Scaler')", opKind: 'action delete', returnVal: '1', returnKind: 'ok' },
      { kind: 'exec-return', line: 2, msg: 'Empty dict — <span class="ok">len(a) = 0</span>.', pairs: [], op: "len(a)", returnVal: '0', returnKind: 'ok' }
    ],
    insight: 'len() on a dict counts <em>key-value pairs</em>. After popping the only pair, the dict is empty.'
  }
];

let scenarioIdx = 0;
let stepIdx = 0;

function render() {
  const sc = SCENARIOS[scenarioIdx];
  document.getElementById('scTitle').textContent = sc.name;
  document.getElementById('scSub').textContent = sc.sub;
  document.getElementById('stepNum').textContent = stepIdx;
  document.getElementById('stepMax').textContent = sc.plan.length;
  document.querySelectorAll('.qb').forEach((b,i) => b.classList.toggle('active', i === scenarioIdx));

  const codeBox = document.getElementById('codeBox');
  const cur = stepIdx > 0 ? sc.plan[stepIdx-1] : null;
  codeBox.innerHTML = sc.code.map((line, i) => {
    let cls = 'code-line';
    if (cur && cur.line === i) {
      if (cur.kind === 'exec-return') cls += ' exec-return';
      else if (cur.kind === 'exec-fail') cls += ' exec-fail';
      else cls += ' exec';
    }
    return `<span class="${cls}">${paint(line)}</span>`;
  }).join('');

  const dictRows = document.getElementById('dictRows');
  const pairs = cur ? cur.pairs : [];
  if (pairs.length === 0) {
    dictRows.innerHTML = '<div style="color:var(--muted);font-style:italic;font-family:Georgia,serif;font-size:13px;text-align:center;padding:12px;">— empty —</div>';
  } else {
    dictRows.innerHTML = pairs.map((p) => {
      let cls = 'pair-row';
      if (p.state === 'new') cls += ' new';
      else if (p.state === 'updated') cls += ' updated';
      else if (p.state === 'removing') cls += ' removing';
      return `<div class="${cls}"><div class="pair-key">${p.key}</div><div class="pair-arrow">→</div><div class="pair-val">${p.val}</div></div>`;
    }).join('');
  }
  document.getElementById('countTag').textContent = `len = ${pairs.length}`;

  const opLine = document.getElementById('opLine');
  if (cur && cur.op) {
    let cls = 'op-line';
    if (cur.opKind) cls += ' ' + cur.opKind;
    opLine.className = cls;
    opLine.innerHTML = `<span class="label">OP:</span>${cur.op}`;
  } else {
    opLine.className = 'op-line';
    opLine.innerHTML = '<span class="label">OP:</span>—';
  }

  const retVal = document.getElementById('returnVal');
  if (cur && cur.returnVal) {
    retVal.style.display = 'flex';
    retVal.innerHTML = `<span class="lbl-r">RETURN:</span><span class="v ${cur.returnKind || ''}">${cur.returnVal}</span>`;
  } else {
    retVal.style.display = 'none';
  }

  document.getElementById('commentary').innerHTML = cur ? cur.msg : 'Click <strong>Step ▸</strong> to begin.';

  const insightHost = document.getElementById('insightHost');
  if (stepIdx === sc.plan.length && sc.insight) {
    insightHost.innerHTML = `<div class="insight">💡 ${sc.insight}</div>`;
  } else {
    insightHost.innerHTML = '';
  }

  document.getElementById('stepBtn').disabled = stepIdx >= sc.plan.length;
}

function reset(newIdx) {
  if (newIdx !== undefined) scenarioIdx = newIdx;
  stepIdx = 0;
  render();
}

document.getElementById('stepBtn').addEventListener('click', () => {
  if (stepIdx < SCENARIOS[scenarioIdx].plan.length) {
    stepIdx++;
    render();
  }
});
document.getElementById('resetBtn').addEventListener('click', () => reset());
document.querySelectorAll('.qb').forEach((b,i) => {
  b.addEventListener('click', () => reset(i));
});

reset(0);
</script>
</body>
</html>
