<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">

  <!-- Background -->
  <rect width="720" height="420" rx="16" fill="#0f172a"/>

  <!-- Title -->
  <text x="360" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">Problem 2 – First Non-Repeating Element</text>
  <text x="360" y="54" text-anchor="middle" font-size="11" fill="#64748b">Input: A = [1, 2, 3, 1, 2, 5]</text>

  <!-- ── SECTION 1: Input Array ── -->
  <text x="36" y="86" font-size="10" font-weight="700" letter-spacing="1.5" fill="#64748b">INPUT ARRAY</text>

  <!-- Array boxes -->
  <!-- Values: 1, 2, 3, 1, 2, 5 at indices 0–5 -->
  <!-- Box x starts at 36, width=80, gap=10 -->

  <!-- Index labels -->
  <text x="76"  y="102" text-anchor="middle" font-size="10" fill="#475569">i=0</text>
  <text x="166" y="102" text-anchor="middle" font-size="10" fill="#475569">i=1</text>
  <text x="256" y="102" text-anchor="middle" font-size="10" fill="#475569">i=2</text>
  <text x="346" y="102" text-anchor="middle" font-size="10" fill="#475569">i=3</text>
  <text x="436" y="102" text-anchor="middle" font-size="10" fill="#475569">i=4</text>
  <text x="526" y="102" text-anchor="middle" font-size="10" fill="#475569">i=5</text>

  <!-- Box 0: value 1 (repeats) -->
  <rect x="36"  y="108" width="80" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="76"  y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#94a3b8">1</text>

  <!-- Box 1: value 2 (repeats) -->
  <rect x="126" y="108" width="80" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="166" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#94a3b8">2</text>

  <!-- Box 2: value 3 (ANSWER – unique) -->
  <rect x="216" y="108" width="80" height="52" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="2.5"/>
  <text x="256" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#86efac">3</text>

  <!-- Box 3: value 1 (repeats) -->
  <rect x="306" y="108" width="80" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="346" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#94a3b8">1</text>

  <!-- Box 4: value 2 (repeats) -->
  <rect x="396" y="108" width="80" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="436" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#94a3b8">2</text>

  <!-- Box 5: value 5 (unique but not first) -->
  <rect x="486" y="108" width="80" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="526" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#94a3b8">5</text>

  <!-- ── PASS 1 LABEL ── -->
  <text x="36" y="184" font-size="10" font-weight="700" letter-spacing="1.5" fill="#64748b">PASS 1 — BUILD FREQUENCY HASHMAP</text>

  <!-- Arrow down from array -->
  <line x1="360" y1="164" x2="360" y2="192" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="356,192 364,192 360,198" fill="#334155"/>

  <!-- Hashmap box -->
  <rect x="36" y="200" width="648" height="72" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="220" font-size="11" font-weight="700" fill="#94a3b8">HashMap</text>

  <!-- Key-value pairs -->
  <!-- 1: 2 -->
  <rect x="110" y="210" width="64" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="142" y="224" text-anchor="middle" font-size="11" fill="#64748b">key</text>
  <text x="142" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">1 → 2</text>

  <!-- 2: 2 -->
  <rect x="204" y="210" width="64" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="236" y="224" text-anchor="middle" font-size="11" fill="#64748b">key</text>
  <text x="236" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">2 → 2</text>

  <!-- 3: 1 (unique) -->
  <rect x="298" y="210" width="64" height="36" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="330" y="224" text-anchor="middle" font-size="11" fill="#86efac">key</text>
  <text x="330" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#86efac">3 → 1</text>

  <!-- 5: 1 (unique but not first) -->
  <rect x="392" y="210" width="64" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="424" y="224" text-anchor="middle" font-size="11" fill="#64748b">key</text>
  <text x="424" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">5 → 1</text>

  <text x="500" y="232" font-size="11" fill="#64748b" font-style="italic">freq = 2 → repeat</text>
  <text x="500" y="248" font-size="11" fill="#64748b" font-style="italic">freq = 1 → unique</text>

  <!-- ── PASS 2 LABEL ── -->
  <text x="36" y="294" font-size="10" font-weight="700" letter-spacing="1.5" fill="#64748b">PASS 2 — ITERATE ORIGINAL ARRAY, RETURN FIRST WITH FREQ = 1</text>

  <!-- Second pass boxes (smaller) -->
  <!-- We iterate left to right; 1 (freq=2 ✗), 2 (freq=2 ✗), 3 (freq=1 ✓ STOP) -->

  <!-- Box i=0: 1 -->
  <rect x="36"  y="302" width="80" height="46" rx="8" fill="#2d1515" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="76"  y="322" text-anchor="middle" font-size="18" font-weight="700" fill="#f87171">1</text>
  <text x="76"  y="339" text-anchor="middle" font-size="10" fill="#f87171">freq=2 ✗</text>

  <!-- Box i=1: 2 -->
  <rect x="126" y="302" width="80" height="46" rx="8" fill="#2d1515" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="166" y="322" text-anchor="middle" font-size="18" font-weight="700" fill="#f87171">2</text>
  <text x="166" y="339" text-anchor="middle" font-size="10" fill="#f87171">freq=2 ✗</text>

  <!-- Box i=2: 3 → ANSWER -->
  <rect x="216" y="302" width="80" height="46" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="2.5"/>
  <text x="256" y="322" text-anchor="middle" font-size="18" font-weight="700" fill="#86efac">3</text>
  <text x="256" y="339" text-anchor="middle" font-size="10" fill="#86efac">freq=1 ✓ STOP</text>

  <!-- Dotted out remaining -->
  <rect x="306" y="302" width="80" height="46" rx="8" fill="#1e293b" stroke="#1e293b" stroke-width="1.5" opacity="0.35"/>
  <text x="346" y="329" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">1</text>

  <rect x="396" y="302" width="80" height="46" rx="8" fill="#1e293b" stroke="#1e293b" stroke-width="1.5" opacity="0.35"/>
  <text x="436" y="329" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">2</text>

  <rect x="486" y="302" width="80" height="46" rx="8" fill="#1e293b" stroke="#1e293b" stroke-width="1.5" opacity="0.35"/>
  <text x="526" y="329" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">5</text>

  <!-- Answer badge -->
  <rect x="36" y="364" width="648" height="40" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="360" y="381" text-anchor="middle" font-size="12" font-weight="700" fill="#86efac">Answer = 3   |   Time: O(N)   |   Space: O(N)</text>
  <text x="360" y="396" text-anchor="middle" font-size="11" fill="#4ade80">Element 3 is the first element with frequency = 1</text>

</svg>
