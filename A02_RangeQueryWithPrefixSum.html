<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Animation 2 — Range Sum Query with Prefix Sum</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    background: #ffffff; color: #000; padding: 24px; min-height: 100vh;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px;
       font-family: -apple-system, system-ui, sans-serif; }
  .subtitle { font-size: 13px; color: #555; margin-bottom: 20px;
              font-family: -apple-system, system-ui, sans-serif; }
  .panel { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 18px;
           margin-bottom: 16px; }
  .panel-title { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase;
                 letter-spacing: 0.6px; margin-bottom: 10px;
                 font-family: -apple-system, system-ui, sans-serif; }
  .array-row { display: flex; gap: 0; }
  .cell {
    width: 78px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; border: 1.5px solid #ddd;
    background: #E6F1FB; color: #185FA5; transition: all 0.3s;
    font-family: 'SF Mono', monospace;
  }
  .cell.dim { background: #f9f9f9; color: #ccc; }
  .cell.in-range { background: #FFF9C4; border-color: #F9A825; color: #5D4037; }
  .cell.l-marker { background: #FFEBEE; border-color: #E53935; color: #B71C1C; }
  .cell.r-marker { background: #E8F5E9; border-color: #43A047; color: #1B5E20; }
  .index-row { display: flex; gap: 0; margin-top: 4px; }
  .idx-label {
    width: 78px; text-align: center; font-size: 11px; color: #888;
    font-family: 'SF Mono', monospace;
  }
  .query-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .qtab {
    padding: 8px 14px; border: 1px solid #ddd; background: white; border-radius: 5px;
    cursor: pointer; font-size: 13px; color: #555;
    font-family: 'SF Mono', monospace; font-weight: 600;
  }
  .qtab:hover { background: #f0f6fc; border-color: #185FA5; }
  .qtab.active { background: #185FA5; color: white; border-color: #185FA5; }
  .calc-cards { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .calc-card { flex: 1 1 200px; min-width: 200px; padding: 12px;
               background: #f9f9f9; border: 1px solid #ddd; border-radius: 6px;
               font-family: 'SF Mono', monospace; font-size: 13px; }
  .calc-card.rc-ok { background: #E8F5E9; border-color: #43A047; }
  .calc-card.rc-hl { background: #FFF9C4; border-color: #F9A825; }
  .calc-card .clbl { font-size: 10px; color: #888; text-transform: uppercase;
                     letter-spacing: 0.5px; margin-bottom: 4px;
                     font-family: -apple-system, system-ui, sans-serif; font-weight: 700; }
  .calc-card .cval { font-size: 16px; font-weight: 700; color: #1B5E20; }
  .narration { padding: 14px 18px; background: #f9f9f9; border-radius: 6px;
               border-left: 3px solid #185FA5; font-size: 14px;
               font-family: -apple-system, system-ui, sans-serif; line-height: 1.5; color: #333;
               margin-top: 14px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 12px;
          font-family: -apple-system, system-ui, sans-serif; font-weight: 600; }
  .sp-hl { background: #FFF9C4; color: #5D4037; border: 1px solid #F9A825; }
  .sp-ok { background: #E8F5E9; color: #1B5E20; border: 1px solid #43A047; }
  .sp-err { background: #FFEBEE; color: #B71C1C; border: 1px solid #E53935; }
</style>
</head>
<body>
<div class="container">
  <h1>Animation 2 · Answering range queries with prefix sum</h1>
  <div class="subtitle">Click any query below to see how sum[L..R] = pf[R] − pf[L−1] computes the answer in O(1).</div>

  <div class="panel">
    <div class="panel-title">Query selector</div>
    <div class="query-tabs" id="tabs"></div>

    <div class="panel-title" style="margin-top:14px;">Original array A</div>
    <div class="array-row" id="arrRow"></div>
    <div class="index-row" id="arrIdx"></div>

    <div class="panel-title" style="margin-top:14px;">Prefix sum array pf</div>
    <div class="array-row" id="pfRow"></div>
    <div class="index-row" id="pfIdx"></div>

    <div class="pills">
      <div class="pill sp-err">▣ pf[L−1]</div>
      <div class="pill sp-ok">▣ pf[R]</div>
      <div class="pill sp-hl">▣ range being summed</div>
    </div>

    <div class="calc-cards" id="calcCards"></div>

    <div class="narration" id="narration">Pick a query to start.</div>
  </div>
</div>

<script>
const A  = [-3, 6, 2, 4, 5, 2, 8, -9, 3, 1];
const pf = [-3, 3, 5, 9, 14, 16, 24, 15, 18, 19];

const queries = [
  { L: 4, R: 8, expected: 9 },
  { L: 3, R: 7, expected: 10 },
  { L: 1, R: 3, expected: 12 },
  { L: 0, R: 4, expected: 14 },
  { L: 7, R: 7, expected: -9 },
];

// Build cells
const arrRow = document.getElementById('arrRow');
const arrIdx = document.getElementById('arrIdx');
const pfRow = document.getElementById('pfRow');
const pfIdx = document.getElementById('pfIdx');
A.forEach((v, i) => {
  const c = document.createElement('div'); c.className = 'cell'; c.id = 'a-' + i; c.textContent = v;
  arrRow.appendChild(c);
  const lbl = document.createElement('div'); lbl.className = 'idx-label'; lbl.textContent = '[' + i + ']';
  arrIdx.appendChild(lbl);
});
pf.forEach((v, i) => {
  const c = document.createElement('div'); c.className = 'cell'; c.id = 'p-' + i; c.textContent = v;
  pfRow.appendChild(c);
  const lbl = document.createElement('div'); lbl.className = 'idx-label'; lbl.textContent = '[' + i + ']';
  pfIdx.appendChild(lbl);
});

// Build tabs
const tabs = document.getElementById('tabs');
queries.forEach((q, i) => {
  const t = document.createElement('button');
  t.className = 'qtab';
  t.textContent = `L=${q.L}, R=${q.R}`;
  t.onclick = () => selectQuery(i);
  tabs.appendChild(t);
});

function selectQuery(qi) {
  document.querySelectorAll('.qtab').forEach((el, i) => el.classList.toggle('active', i === qi));
  const q = queries[qi];

  // Reset
  document.querySelectorAll('#arrRow .cell').forEach((c, i) => {
    c.className = 'cell';
    if (i < q.L || i > q.R) c.classList.add('dim');
    else c.classList.add('in-range');
  });
  document.querySelectorAll('#pfRow .cell').forEach((c, i) => {
    c.className = 'cell dim';
  });
  if (q.L > 0) document.getElementById('p-' + (q.L - 1)).className = 'cell l-marker';
  document.getElementById('p-' + q.R).className = 'cell r-marker';

  // Calc cards
  const cards = document.getElementById('calcCards');
  cards.innerHTML = '';
  if (q.L === 0) {
    cards.innerHTML = `
      <div class="calc-card rc-hl">
        <div class="clbl">FORMULA (L = 0)</div>
        <div style="margin-top:4px;">sum[0..R] = pf[R]</div>
      </div>
      <div class="calc-card rc-ok">
        <div class="clbl">pf[${q.R}]</div>
        <div class="cval">${pf[q.R]}</div>
      </div>
      <div class="calc-card rc-ok">
        <div class="clbl">ANSWER</div>
        <div class="cval">${q.expected}</div>
      </div>`;
  } else {
    cards.innerHTML = `
      <div class="calc-card rc-hl">
        <div class="clbl">FORMULA</div>
        <div style="margin-top:4px;">pf[${q.R}] − pf[${q.L - 1}]</div>
      </div>
      <div class="calc-card">
        <div class="clbl">pf[${q.R}]</div>
        <div class="cval" style="color:#1B5E20;">${pf[q.R]}</div>
      </div>
      <div class="calc-card">
        <div class="clbl">pf[${q.L - 1}]</div>
        <div class="cval" style="color:#B71C1C;">${pf[q.L - 1]}</div>
      </div>
      <div class="calc-card rc-ok">
        <div class="clbl">ANSWER</div>
        <div class="cval">${pf[q.R]} − ${pf[q.L - 1]} = ${q.expected}</div>
      </div>`;
  }

  // Narration
  const narration = document.getElementById('narration');
  if (q.L === 0) {
    narration.innerHTML = `Edge case: <b>L = 0</b>. There's nothing before index 0, so we don't subtract anything. The answer is just <b>pf[${q.R}] = ${q.expected}</b>.`;
  } else {
    narration.innerHTML = `<b>sum[${q.L}..${q.R}]</b> = pf[${q.R}] − pf[${q.L - 1}] = ${pf[q.R]} − ${pf[q.L - 1]} = <b>${q.expected}</b>. One subtraction. O(1).`;
  }
}

selectQuery(0);
</script>
</body>
</html>
